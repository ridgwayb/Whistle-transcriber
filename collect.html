<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Voice test</title>
<style>
  :root {
    --fog:#e8ecef; --sheet:#fbfcfc; --ink:#16222e; --ink-soft:#55636f; --line:#c9d1d8;
    --blue:#1d4f9c; --blue-ink:#fff; --rec:#c2331f; --ok:#1d6b4a; --err:#a3261a;
    --ui: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --read: "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --fog:#11171d; --sheet:#1a222a; --ink:#e6ecf1; --ink-soft:#94a3b0; --line:#2f3b46;
            --blue:#7fb0ff; --blue-ink:#0c1722; --rec:#ff7a66; --ok:#6fd1a1; --err:#ff8f80; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--fog); color:var(--ink); font:16px/1.5 var(--ui);
         padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(32px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left)); }
  main { max-width:680px; margin:0 auto; display:grid; gap:18px; }
  .hrow { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; }
  h1 { margin:0; font:600 1.6rem/1.2 var(--read); }
  h2 { margin:0; font-size:1.1rem; }
  p { margin:0; color:var(--ink-soft); }
  section { background:var(--sheet); border:1px solid var(--line); border-radius:10px; padding:16px; display:grid; gap:12px; }
  .row { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  label { display:grid; gap:4px; font-size:.9rem; color:var(--ink-soft); }
  input[type=text], select { font:1rem var(--ui); padding:10px 12px; border:1px solid var(--line); border-radius:8px;
         background:var(--sheet); color:var(--ink); min-height:44px; }
  select.small { min-height:36px; padding:6px 10px; font-size:.9rem; }
  .btn { appearance:none; border:1px solid var(--blue); background:var(--blue); color:var(--blue-ink); font:600 1rem var(--ui);
         padding:12px 18px; border-radius:8px; cursor:pointer; min-height:48px; }
  .btn.quiet { background:transparent; color:var(--ink); border-color:var(--line); font-weight:500; }
  .btn[data-on="true"] { background:var(--rec); border-color:var(--rec); color:#fff; }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  .btn:focus-visible, input:focus-visible, select:focus-visible { outline:3px solid var(--blue); outline-offset:2px; }
  .passage { font:1.25rem/1.6 var(--read); color:var(--ink); margin:0; }
  .card { border-top:1px solid var(--line); padding-top:12px; display:grid; gap:10px; }
  .card:first-of-type { border-top:0; padding-top:0; }
  .card h3 { margin:0; font-size:.95rem; color:var(--ink-soft); font-weight:600; }
  .card audio { width:100%; }
  .meter { --lvl:0; width:120px; height:6px; background:var(--line); border-radius:3px; overflow:hidden; }
  .meter::after { content:""; display:block; height:100%; width:calc(var(--lvl)*100%); background:var(--ok); }
  .state { font-size:.9rem; color:var(--ink-soft); }
  .state.ok { color:var(--ok); }
  #status { min-height:1.5em; color:var(--ink-soft); }
  #status[data-kind=ok] { color:var(--ok); }
  #status[data-kind=error] { color:var(--err); }
  small { color:var(--ink-soft); }
</style>
</head>
<body>
<main>
  <header>
    <div class="hrow">
      <h1 id="title"></h1>
      <select id="uiLang" class="small" aria-label="Language">
        <option value="en">English</option>
        <option value="nl">Nederlands</option>
        <option value="fr">Français</option>
        <option value="pl">Polski</option>
        <option value="es">Español</option>
      </select>
    </div>
    <p id="intro" style="margin-top:6px"></p>
  </header>

  <section>
    <p id="consent"></p>
    <p id="how"></p>
    <div class="row">
      <label><span id="nameLabel"></span><input type="text" id="who" autocomplete="given-name" maxlength="24" size="16"></label>
      <label><span id="readLabel"></span>
        <select id="readLang"></select>
      </label>
    </div>
  </section>

  <div id="slots" style="display:grid;gap:18px"></div>

  <section>
    <div class="row">
      <button class="btn" id="sendBtn"></button>
      <span id="status" role="status"></span>
    </div>
    <div id="backup" style="display:grid;gap:8px">
      <p id="backupText"></p>
      <div class="row">
        <button class="btn quiet" id="shareBtn"></button>
        <button class="btn quiet" id="dlBtn"></button>
      </div>
    </div>
  </section>
</main>
<script type="module" src="collect.js"></script>
</body>
</html>
